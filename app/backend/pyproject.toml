[project]
name = "inspecao-backend"
version = "0.1.0"
description = "Backend de verificacao automatizada de fotos de leitura (Neoenergia PE)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "onnxruntime>=1.20",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "onnx>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspecao"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# -rs: lista os testes pulados. O teste de regressao de dados pula sem banco ou
# sem os 4 lotes ingeridos, e isso precisa ficar visivel, nao virar verde falso.
addopts = "-rs"
