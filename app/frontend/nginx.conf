server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Assets com hash no nome podem ser cacheados por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index nunca pode ser cacheado, senao o usuario fica preso numa versao antiga.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # A API roda no servico "api" do compose.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida devolve o index, senao recarregar em /fila da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
