services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inspecao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inspecao_dev}
      POSTGRES_DB: ${POSTGRES_DB:-inspecao}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspecao} -d ${POSTGRES_DB:-inspecao}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./app/backend
    env_file: .env
    environment:
      APP_ROOT: /app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inspecao}:${POSTGRES_PASSWORD:-inspecao_dev}@postgres:5432/${POSTGRES_DB:-inspecao}
      STORAGE_LOCAL_ROOT: /app/data/storage
      INGEST_STAGING_DIR: /app/data/staging
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: ./app/backend
    command: ["python", "-m", "inspecao.jobs.worker"]
    env_file: .env
    environment:
      APP_ROOT: /app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inspecao}:${POSTGRES_PASSWORD:-inspecao_dev}@postgres:5432/${POSTGRES_DB:-inspecao}
      STORAGE_LOCAL_ROOT: /app/data/storage
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    profiles: ["completo"]   # so sobe a partir do marco M3, quando o worker existir

  frontend:
    build: ./app/frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
