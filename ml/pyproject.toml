[project]
name = "inspecao-ml"
version = "0.1.0"
description = "Treino e avaliacao dos modelos de visao computacional (Neoenergia PE)"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "tqdm>=4.67",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlinsp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
